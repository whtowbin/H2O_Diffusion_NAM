[project]
name = "h2o-diffusion-nam"
version = "0.1.0"
description = "Finite-difference models of hydrogen diffusion in olivine and clinopyroxene"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
    "numba>=0.68.0",
    "numpy>=2.3.3",
    "pandas>=2.2",
    "pyjanitor>=0.31.0",
    "scipy>=1.16.2",
    "vesical>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
